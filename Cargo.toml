[package]
name = "passgen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "passgen"
path = "src/main.rs"

[dependencies]
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
getrandom = "0.2"
rpassword = "7"
open = "5"
tiny_http = "0.12"
dotenvy = "0.15"

[target.'cfg(unix)'.dependencies]
termios = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
arboard = "3"
